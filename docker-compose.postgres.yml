# Optional override when DATABASE_URL points at the compose Postgres service.
# Postgres is included by default in docker-compose.prod.yml; this file is kept
# for explicit depends_on wiring if you split stacks.

services:
  backend:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
