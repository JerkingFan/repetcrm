name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-prod.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          APP_ENV: development
          SECRET_KEY: test-secret-key-for-ci-pipeline-32chars
          DATABASE_URL: sqlite:///./data/ci_test.db
          REDIS_URL: ""
          API_RATE_LIMIT_ENABLED: "false"
        run: pytest --cov=app --cov-config=pytest.ini --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-prod.txt

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17B747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start API and run k6 smoke
        working-directory: backend
        env:
          APP_ENV: development
          SECRET_KEY: test-secret-key-for-ci-pipeline-32chars
          DATABASE_URL: sqlite:///./data/ci_smoke.db
          REDIS_URL: ""
          API_RATE_LIMIT_ENABLED: "false"
          AUTH_REGISTER_MAX_PER_IP: "100"
        run: |
          mkdir -p data media
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          k6 run ../deploy/loadtest/k6/smoke-ci.js
        shell: bash

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/uvicorn.pid ]; then kill "$(cat /tmp/uvicorn.pid)" || true; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and lint
        run: |
          npm ci
          npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-prod.txt

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt

      - name: Install frontend and Playwright
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Run Playwright smoke tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          mkdir -p ../backend/data ../backend/media
          (cd ../backend && APP_ENV=development SECRET_KEY=test-secret-key-for-ci-pipeline-32chars DATABASE_URL=sqlite:///./data/e2e.db REDIS_URL="" API_RATE_LIMIT_ENABLED=false AUTH_REGISTER_MAX_PER_IP=100 uvicorn app.main:app --host 127.0.0.1 --port 8000) &
          echo $! > /tmp/e2e-api.pid
          PORT=3000 npm run start &
          echo $! > /tmp/e2e-web.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && curl -fsS http://127.0.0.1:3000/login && break
            sleep 2
          done
          npm run test:e2e
        shell: bash

      - name: Stop servers
        if: always()
        run: |
          if [ -f /tmp/e2e-api.pid ]; then kill "$(cat /tmp/e2e-api.pid)" || true; fi
          if [ -f /tmp/e2e-web.pid ]; then kill "$(cat /tmp/e2e-web.pid)" || true; fi
