[pytest]
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts =
    --strict-markers
    -ra

[coverage:run]
source = app
include =
    app/routers/auth_router.py
    app/routers/students.py
    app/routers/lessons.py
    app/routers/portal.py
    app/error_handlers.py
    app/middleware/request_id.py
    app/middleware/api_rate_limit.py
    app/startup_checks.py
    app/services/auth_sessions.py
    app/services/password_reset.py
omit =
    */tests/*

[coverage:report]
show_missing = true
skip_covered = false
fail_under = 60
