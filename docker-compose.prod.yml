# Production: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# ВАЖНО: реальные пользователи по умолчанию в SQLite volume backend_data.
# Не переключайте на PostgreSQL без явной миграции данных!
#
# Порты backend/frontend по умолчанию только на localhost — снаружи должен стоять nginx.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repetcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-repetcrm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/sql/postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repetcrm} -d ${POSTGRES_DB:-repetcrm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - postgres

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/repetcrm.db}
      REDIS_URL: ${REDIS_URL:-redis://:changeme@redis:6379/0}
      MEDIA_DIR: /app/media
      APP_ENV: ${APP_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ALLOW_LOCALHOST_REGEX: ${CORS_ALLOW_LOCALHOST_REGEX:-false}
    volumes:
      - backend_data:/app/data
      - backend_media:/app/media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 503 when DB is down — see /health
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health'); assert r.status==200",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 90s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: ["arq", "app.worker_settings.WorkerSettings"]
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/repetcrm.db}
      REDIS_URL: ${REDIS_URL:-redis://:changeme@redis:6379/0}
      MEDIA_DIR: /app/media
      APP_ENV: ${APP_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ALLOW_LOCALHOST_REGEX: ${CORS_ALLOW_LOCALHOST_REGEX:-false}
    volumes:
      - backend_data:/app/data
      - backend_media:/app/media
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set public API URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      # NOTE: NEXT_PUBLIC_* is baked at image build — always --build after changing it
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
  backend_data:
  backend_media:
